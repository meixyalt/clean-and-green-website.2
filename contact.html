<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h2>🌱 Clean and Green</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page">
    <h1>Contact Us 💌</h1>
    <p>Share your ideas for a cleaner and greener community.</p>

    <form id="contactForm" class="content">
      <label for="name">Name</label>
      <input type="text" id="name" name="name"
             placeholder="Enter your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email"
             placeholder="Enter your email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5"
                placeholder="Write your message" required></textarea>

      <button type="submit">Send Message 💗</button>

      <p id="formStatus" role="status"></p>
      <small>Demo only: your message is not sent or saved.</small>
    </form>
  </main>

  <footer>
    <p>🌸 Clean and Green | Caring for Our Planet</p>
  </footer>
</body>
</html>
